name: Node.js CI

on:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify Node.js app
        run: node -e "console.log('Node.js app verification successful')"

      - name: Break the pipeline intentionally
        run: exit 1

